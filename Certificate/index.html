<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate Verification Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .brand-text { font-family: 'Montserrat', sans-serif; }
        .accent-gradient { background: linear-gradient(135deg, #114232 0%, #1d5c47 100%); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-center p-4 md:p-8">

    <main class="w-full max-w-4xl mx-auto bg-white rounded-3xl shadow-2xl border border-gray-100 overflow-hidden relative">
        
        <div class="absolute inset-0 flex items-center justify-center opacity-[0.07] z-0 pointer-events-none">
            <img src="https://verify-registry.github.io/ISO/4.png" alt="Watermark" class="max-w-md w-full h-auto">
        </div>

        <div class="relative z-10">
            
            <div class="accent-gradient p-8 text-white flex flex-col md:flex-row items-center justify-between gap-4">
                <div>
                    <h1 class="brand-text text-2xl font-bold tracking-tight">Official Certification Verification</h1>
                    <p class="text-emerald-200 text-sm mt-1">Real-time Credential Validation System</p>
                </div>
                <div class="flex items-center gap-2 bg-white/10 px-4 py-2 rounded-full border border-white/20 backdrop-blur-sm">
                    <span class="w-3 h-3 rounded-full bg-green-400 animate-pulse"></span>
                    <span class="text-sm font-bold tracking-wide">VERIFIED</span>
                </div>
            </div>

            <div class="p-8 grid grid-cols-1 md:grid-cols-2 gap-8">
                
                <div class="space-y-6">
                    <div>
                        <label class="text-xs font-bold text-gray-400 uppercase tracking-widest">Candidate Name</label>
                        <p class="text-xl font-bold text-gray-900 mt-1">Ahmed Wageh Ibrahim Elgabaly</p>
                    </div>
                    <div>
                        <label class="text-xs font-bold text-gray-400 uppercase tracking-widest">Course Title</label>
                        <p class="text-lg font-semibold text-gray-800 mt-1">ISO 45001:2018 Lead Auditor</p>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="text-xs font-bold text-gray-400 uppercase tracking-widest">Certificate No.</label>
                            <p class="text-sm font-mono font-bold text-[#114232] mt-1">ISO45001-LA-2026-58324</p>
                        </div>
                        <div>
                            <label class="text-xs font-bold text-gray-400 uppercase tracking-widest">Duration</label>
                            <p class="text-sm font-semibold text-gray-800 mt-1">40 Hours (5 Days)</p>
                        </div>
                    </div>
                </div>

                <div class="space-y-6">
                    <div>
                        <label class="text-xs font-bold text-gray-400 uppercase tracking-widest">Training Provider</label>
                        <p class="text-lg font-semibold text-gray-900 mt-1">International Safety Training Academy</p>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="text-xs font-bold text-gray-400 uppercase tracking-widest">Issue Date</label>
                            <p class="text-sm font-semibold text-gray-800 mt-1">05/05/2026</p>
                        </div>
                        <div>
                            <label class="text-xs font-bold text-gray-400 uppercase tracking-widest">Expiry Date</label>
                            <p class="text-sm font-semibold text-gray-800 mt-1">05/05/2028</p>
                        </div>
                    </div>
                </div>

            </div>

            <div class="bg-gray-50 p-6 border-t border-gray-100 flex flex-wrap items-center justify-center gap-8">
                <img src="https://verify-registry.github.io/ISO/2.png" alt="CQI IRCA" class="h-12 object-contain">
                <img src="https://verify-registry.github.io/ISO/1.png" alt="ISO" class="h-12 object-contain">
                <img src="https://verify-registry.github.io/ISO/3.png" alt="SNR" class="h-12 object-contain">
            </div>

        </div>
    </main>

    <p class="text-center text-gray-400 text-xs mt-8">&copy; 2026 Global Verification Directory System.</p>

</body>
</html>
