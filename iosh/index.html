<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DC Web | Home</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700" media="all">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    
    <style>
        /* Base & Reset */
        * { box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f2f3f8;
            margin: 0;
            padding: 0;
            color: #646c9a;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        
        /* Layout Structure */
        .kt-grid { display: flex; flex-direction: column; flex: 1 1 auto; width: 100%; }
        .kt-wrapper { display: flex; flex-direction: column; flex: 1; }
        
        .kt-container {
            width: 100%;
            padding-right: 25px;
            padding-left: 25px;
            margin-right: auto;
            margin-left: auto;
        }
        @media (min-width: 1025px) { .kt-container { max-width: 1140px; } }

        /* Header (Dark Theme as per CSS overrides) */
        header {
            background-color: rgb(0, 10, 40);
            height: 60px;
            display: flex;
            align-items: center;
        }

        /* Main Body & Card */
        .kt-body { margin-top: 30px; margin-bottom: 30px; flex: 1; }
        
        .kt-portlet {
            background-color: #ffffff;
            border-radius: 4px;
            box-shadow: 0px 0px 13px 0px rgba(82, 63, 105, 0.05);
            margin-bottom: 20px;
        }
        
        .kt-portlet__body { padding: 25px; }
        
        .mb-4 { margin-bottom: 1.5rem !important; }
        .pull-right { float: right; }
        
        /* Logos */
        .kt-header__brand-logo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .kt-header__brand-logo-default, 
        .kt-header__brand-sublogo-default {
            max-height: 40px;
            max-width: 100%;
        }

        /* Success Alert */
        .alert {
            position: relative;
            padding: 1rem 1.25rem;
            margin-bottom: 1.5rem;
            border-radius: 4px;
            display: flex;
            align-items: center;
        }
        
        .alert-success {
            background-color: rgb(0, 122, 90) !important;
            border: 1px solid rgb(0, 122, 90) !important;
            color: #ffffff;
        }
        
        .alert-icon {
            font-size: 1.6rem;
            margin-right: 1.2rem;
            display: flex;
            align-items: center;
        }
        
        .alert-text {
            font-size: 1rem;
            font-weight: 400;
            line-height: 1.5;
        }

        /* Document Viewer */
        .row { display: flex; flex-wrap: wrap; margin-right: -10px; margin-left: -10px; }
        .col-md-12 { position: relative; width: 100%; padding-right: 10px; padding-left: 10px; }
        
        .report-viewer-container {
            width: 100%;
            height: 700px;
            background-color: #e2e8f0;
            border-radius: 4px;
            overflow: hidden;
            display: block;
        }
        .report-viewer-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Footer */
        .kt-footer {
            background-color: rgb(0, 10, 40);
            padding: 15px 0;
            color: #ffffff;
            font-size: 13px;
        }
        .kt-footer__bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .kt-footer__copyright { color: #ffffff; }
        
        .kt-footer__menu { display: flex; gap: 15px; }
        .kt-footer__menu a {
            color: #ffffff;
            text-decoration: none;
            transition: color 0.3s;
        }
        .kt-footer__menu a:hover { text-decoration: underline; }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .kt-footer__bottom { flex-direction: column; text-align: center; }
            .kt-footer__menu { margin-top: 15px; flex-wrap: wrap; justify-content: center; }
            .kt-header__brand-logo { flex-direction: column; align-items: flex-start; gap: 15px; }
            .pull-right { float: none; }
        }
    </style>
</head>
<body>
    <div class="kt-grid kt-grid--hor kt-grid--root">
        <div class="kt-grid__item kt-grid__item--fluid kt-grid kt-grid--ver kt-page">
            <div class="kt-wrapper" id="kt_wrapper">
                
                <header id="m_header">
                    </header>

                <div class="kt-body kt-container">
                    <div id="svpPortlet" class="kt-portlet">
                        <div class="kt-portlet__body">
                            
                            <div class="kt-header__brand-logo mb-4">
                                <img alt="Dc Web" src="https://very.iosh.com/img/logo-default.png" class="kt-header__brand-logo-default">
                                <img alt="Smart Verify Plus" src="https://very.iosh.com/images/Smart-Verify-Plus-Logo.png" class="kt-header__brand-sublogo-default pull-right">
                            </div>

                            <div class="alert alert-success" role="alert">
                                <div class="alert-icon">
                                    <i aria-hidden="true" class="far fa-check-circle fa-lg"></i>
                                </div>
                                <div class="alert-text">
                                    This document is valid and was issued by IOSH (Institution of Occupational Safety and Health) to OMAR FOUAD DINO on 25 Feb 2026
                                </div>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-12">
                                    <div id="documentViewerContainer" class="report-viewer-container">
                                        <iframe src="about:blank" title="Certificate Document"></iframe>
                                    </div>
                                </div>
                            </div>
                            
                        </div>
                    </div>
                </div>

                <div class="kt-footer">
                    <div class="kt-container">
                        <div class="kt-footer__bottom">
                            <div class="kt-footer__copyright">
                                2026 © DSSL
                            </div>
                            <div class="kt-footer__menu">
                                <a href="https://very.iosh.com/Pages/Privacy">Privacy</a>
                                <a href="https://very.iosh.com/Pages/Faq">FAQ</a>
                                <a href="https://very.iosh.com/Pages/Cookies">Cookies</a>
                                <a href="https://very.iosh.com/Pages/Terms">Terms</a>
                                <a href="https://very.iosh.com/Pages/Support">Support</a>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</body>
</html>
